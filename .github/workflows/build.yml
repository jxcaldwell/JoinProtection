name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|warning: \[|What went wrong|Could not|Execution failed|Unsupported|FAILURE|Caused by" -A4 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build errors::${msg}"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: JoinProtection-jar
          path: build/libs/*.jar

      - name: Inspect jar
        run: |
          ls -l build/libs
          jar=$(ls build/libs/*.jar | head -1)
          meta=$(unzip -p "$jar" plugin.yml | head -12 | awk '{printf "%s%%0A", $0}')
          top=$(unzip -l "$jar" | awk '{print $4}' | grep -E '^[a-z]+/' | cut -d/ -f1-3 | sort -u | head -15 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Jar inspection::$(basename "$jar") $(du -h "$jar" | cut -f1)%0A${meta}%0A--- packages ---%0A${top}"

      - name: Publish release
        if: github.ref == 'refs/heads/paper-26.2-support'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create paper-26.2-build build/libs/*.jar --target "${{ github.sha }}" --prerelease \
            --title "JoinProtection (Paper 26.2 build)" \
            --notes "Unofficial build of JoinProtection targeting Paper 26.2 (Java 25)." \
          || gh release upload paper-26.2-build build/libs/*.jar --clobber
